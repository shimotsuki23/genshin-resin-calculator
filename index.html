<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <title>原神 樹脂計算機</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
      background: #f3f0e8;
      color: #3d3a34;
    }
    .card {
      width: min(100%, 430px);
      background: #fffdf8;
      border: 1px solid #d8d0bf;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(70, 60, 45, .12);
    }
    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 24px;
    }
    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cfc6b5;
      border-radius: 10px;
      background: #fff;
      font-size: 18px;
      color: inherit;
    }
    input:focus {
      outline: 2px solid #b9a985;
      outline-offset: 1px;
    }
    .clock {
      margin-bottom: 20px;
      padding: 14px;
      border-radius: 13px;
      background: #f1ede4;
      text-align: center;
    }
    .now {
      font-size: 22px;
      font-weight: 800;
    }
    .result {
      margin-top: 24px;
      padding: 18px;
      border-radius: 13px;
      background: #eee9dd;
      text-align: center;
    }
    .caption {
      font-size: 13px;
      color: #777064;
      margin-bottom: 6px;
    }
    .big {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .date {
      font-size: 19px;
      font-weight: 700;
    }
    .breakdown {
      margin-top: 24px;
    }
    .breakdown h2 {
      margin: 0 0 10px;
      font-size: 17px;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d8d0bf;
      border-radius: 12px;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid #e3ddcf;
      white-space: nowrap;
    }
    th {
      background: #eee9dd;
      font-weight: 700;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .breakdown-note {
      margin-top: 8px;
      font-size: 12px;
      color: #81796d;
    }
    .error {
      margin-top: 16px;
      color: #a33a32;
      text-align: center;
      font-size: 14px;
    }
    .note {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #81796d;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>原神 樹脂計算機</h1>

    <section class="clock">
      <div class="caption">現在時刻</div>
      <div class="now" id="now">--</div>
    </section>

    <label for="resin">現在の樹脂</label>
    <input id="resin" type="number" min="0" max="200" step="1" placeholder="例：43" inputmode="numeric">

    <section class="result" id="result" hidden>
      <div class="caption">200まであと</div>
      <div class="big" id="remaining">--</div>

      <div class="caption">200になる日時</div>
      <div class="date" id="target">--</div>
    </section>

    <section class="breakdown" id="breakdown" hidden>
      <h2>20ずつ使った場合</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>累計使用</th>
              <th>残り樹脂</th>
              <th>200到達まで</th>
              <th>到達日時</th>
            </tr>
          </thead>
          <tbody id="breakdownBody"></tbody>
        </table>
      </div>
      <div class="breakdown-note">「累計使用」は、現在の樹脂から20ずつ使った場合の合計です。</div>
    </section>

    <div class="error" id="error"></div>

    <div class="note">
      樹脂は8分で1個回復します。<br>
      現在時刻は端末の時刻を使用します。
    </div>
  </main>

  <script>
    const resinInput = document.getElementById("resin");
    const result = document.getElementById("result");
    const remaining = document.getElementById("remaining");
    const target = document.getElementById("target");
    const error = document.getElementById("error");
    const breakdown = document.getElementById("breakdown");
    const breakdownBody = document.getElementById("breakdownBody");

    function formatDate(date) {
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return `${month}月${day}日 ${hour}時${minute}分`;
    }

    function updateClock() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const hour = String(now.getHours()).padStart(2, "0");
      const minute = String(now.getMinutes()).padStart(2, "0");
      const second = String(now.getSeconds()).padStart(2, "0");

      document.getElementById("now").textContent =
        `${month}月${day}日 ${hour}時${minute}分${second}秒`;

      calculate();
    }

    function calculate() {
      const value = resinInput.value.trim();

      if (value === "") {
        result.hidden = true;
        error.textContent = "";
        return;
      }

      const resin = Number(value);

      if (!Number.isInteger(resin) || resin < 0 || resin > 200) {
        result.hidden = true;
        error.textContent = "0〜200の整数を入力してください。";
        return;
      }

      error.textContent = "";
      result.hidden = false;

      const missing = 200 - resin;
      const totalMinutes = missing * 8;

      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      remaining.textContent = `${hours}時間${minutes}分`;

      const now = new Date();
      const targetTime = new Date(now.getTime() + totalMinutes * 60 * 1000);

      target.textContent = formatDate(targetTime);

      // 現在の樹脂から20ずつ消費した場合の一覧を作成
      breakdownBody.innerHTML = "";

      const maxSpend = Math.floor(resin / 20) * 20;

      if (maxSpend >= 20) {
        breakdown.hidden = false;

        for (let spent = 20; spent <= maxSpend; spent += 20) {
          const remainingResin = resin - spent;
          const minutesToMax = (200 - remainingResin) * 8;
          const hoursToMax = Math.floor(minutesToMax / 60);
          const minsToMax = minutesToMax % 60;
          const arrival = new Date(now.getTime() + minutesToMax * 60 * 1000);

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${spent}個</td>
            <td>${remainingResin}個</td>
            <td>${hoursToMax}時間${minsToMax}分</td>
            <td>${formatDate(arrival)}</td>
          `;
          breakdownBody.appendChild(row);
        }
      } else {
        breakdown.hidden = true;
      }
    }

    resinInput.addEventListener("input", calculate);

    // 時計を1秒ごとに更新し、計算結果も現在時刻に追従させる
    updateClock();
    setInterval(updateClock, 1000);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
