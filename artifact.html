<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聖遺物スコア｜原神ツール</title><style>
.tool-nav{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:12px}
.tool-nav a{color:#625844;text-decoration:none;border:1px solid #d8d0bf;border-radius:8px;padding:7px 8px;background:#fff}
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f3f0e8;color:#3d3a34;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.card{max-width:520px;margin:auto;background:#fffdf8;border:1px solid #d8d0bf;border-radius:16px;padding:14px;box-shadow:0 6px 24px rgba(70,60,45,.10)}h1{text-align:center;font-size:20px;margin:2px 0 12px}.select{padding:10px;background:#eee9dd;border-radius:10px;margin-bottom:10px}label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}select{width:100%;padding:8px;border:1px solid #cfc6b5;border-radius:8px;background:#fff;font-size:15px}.artifact{border:1px solid #d8d0bf;border-radius:11px;margin-bottom:8px;padding:9px;background:#fff}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.part{font-size:15px;font-weight:800}.ps{font-size:18px;font-weight:800}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.field label{font-size:10px;font-weight:600;color:#777064;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.field input{width:100%;padding:7px 5px;border:1px solid #cfc6b5;border-radius:7px;font-size:15px;text-align:right}.field input:focus{outline:2px solid #b9a985;outline-offset:1px}.reset-piece,.reset-all{border:1px solid #cfc6b5;border-radius:7px;background:#f7f4ec;color:#5f5a51}.reset-piece{width:100%;margin-top:9px;padding:5px;font-size:11px}.total{margin-top:10px;padding:11px;border-radius:10px;background:#eee9dd;text-align:center}.tl{font-size:11px;color:#777064}.ts{font-size:27px;font-weight:800}.reset-all{display:block;width:100%;margin-top:8px;padding:8px;font-size:12px}.note{text-align:center;font-size:10px;color:#81796d;margin-top:8px}</style></head><body><main class="card"><nav class="tool-nav"><a href="index.html">← ツール一覧</a><a href="resin.html">← 樹脂計算へ</a></nav><h1>原神 聖遺物スコア計算機</h1><section class="select"><label for="type">参照ステータス</label><select id="type"><option value="atk">攻撃力</option><option value="hp">HP</option><option value="def">防御力</option><option value="em">元素熟知</option></select></section><div id="arts"></div><section class="total"><div class="tl">合計スコア</div><div class="ts" id="total">0.0</div></section><button type="button" class="reset-all" id="resetAll">5部位をすべてリセット</button><div class="note">数値を入力するとリアルタイムで計算</div></main><script>const cfg={atk:["攻撃力%",1],hp:["HP%",1],def:["防御力%",.8],em:["元素熟知",.25]},parts=["花","羽","時計","杯","冠"],arts=document.getElementById("arts");parts.forEach(x=>arts.insertAdjacentHTML("beforeend",`<section class="artifact"><div class="head"><div class="part">${x}</div><div class="ps">0.0</div></div><div class="fields"><div class="field"><label class="rl">攻撃力%</label><input class="ref" type="number" step="0.1" min="0" inputmode="decimal"></div><div class="field"><label>会心率</label><input class="cr" type="number" step="0.1" min="0" inputmode="decimal"></div><div class="field"><label>会心ダメ</label><input class="cd" type="number" step="0.1" min="0" inputmode="decimal"></div></div><button type="button" class="reset-piece">この部位をリセット</button></section>`));const type=document.getElementById("type"),total=document.getElementById("total"),n=e=>Number.isFinite(parseFloat(e.value))?parseFloat(e.value):0;function calc(){const c=cfg[type.value];let s=0;document.querySelectorAll(".artifact").forEach(a=>{const v=n(a.querySelector(".ref"))*c[1]+n(a.querySelector(".cr"))*2+n(a.querySelector(".cd"));a.querySelector(".ps").textContent=v.toFixed(1);s+=v});total.textContent=s.toFixed(1)}function update(){document.querySelectorAll(".rl").forEach(x=>x.textContent=cfg[type.value][0]);calc()}document.addEventListener("input",e=>{if(e.target.matches("input"))calc()});document.addEventListener("click",e=>{if(e.target.matches(".reset-piece")){e.target.closest(".artifact").querySelectorAll("input").forEach(i=>i.value="");calc()}});document.getElementById("resetAll").addEventListener("click",()=>{document.querySelectorAll(".artifact input").forEach(i=>i.value="");calc()});type.addEventListener("change",update);update();</script></body></html>
